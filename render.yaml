services:
  - type: web
    name: quiniela-liguilla-mx
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --no-save pg@8
    startCommand: node quiniela.mjs
    healthCheckPath: /api/state
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: quiniela-liguilla-db
          property: connectionString
databases:
  - name: quiniela-liguilla-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
